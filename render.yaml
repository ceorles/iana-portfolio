# Render Blueprint for this repo. See:
# https://render.com/docs/blueprint-spec
#
# Deploying this file creates three resources:
#   1. iana-portfolio-db       — Postgres instance
#   2. iana-portfolio-backend  — Django API (Gunicorn)
#   3. iana-portfolio-frontend — React/Vite static site
#
# After the first sync, set the `sync: false` env vars below in the Render
# dashboard (Render prompts for these automatically) — everything else is
# wired up already.

databases:
  - name: iana-portfolio-db
    postgresMajorVersion: "17"

services:
  - type: web
    name: iana-portfolio-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/profiles/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: iana-portfolio-db
          property: connectionString
      # Set to the deployed frontend URL, e.g.
      # https://iana-portfolio-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Set to this backend's own URL, e.g.
      # https://iana-portfolio-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Optional: set all three to auto-create an admin login on first
      # deploy (see core/management/commands/ensure_admin.py). Leave unset
      # to skip — you can also create one later via the Render shell.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: iana-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      # Set to the deployed backend URL + /api, e.g.
      # https://iana-portfolio-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # Client-side routing (React Router): let /admin/* etc. resolve to
      # index.html on a hard refresh instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
